<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAYA Human Energy Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>RAYA Human Energy Dashboard</h1>

        <!-- Analytics Cards -->
        <div class="cards">

            <div class="card">
                <h3>Avg Sleep</h3>
                <p id="avgSleep">--</p>
            </div>

            <div class="card">
                <h3>Total Steps</h3>
                <p id="totalSteps">--</p>
            </div>

            <div class="card">
                <h3>Screen Time</h3>
                <p id="avgScreen">--</p>
            </div>

            <div class="card">
                <h3>Mood</h3>
                <p id="avgMood">--</p>
            </div>

            <div class="card">
                <h3>Stress</h3>
                <p id="avgStress">--</p>
            </div>

            <div class="card">
                <h3>Water Intake</h3>
                <p id="avgWater">--</p>
            </div>

            <div class="card">
                <h3>Calories</h3>
                <p id="avgCalories">--</p>
            </div>

            <div class="card">
                <h3>Exercise</h3>
                <p id="avgExercise">--</p>
            </div>

            <div class="card">
                <h3>Learning</h3>
                <p id="avgLearning">--</p>
            </div>

        </div>

        <!-- Insights -->
        <h2>RAYA Insights</h2>

        <ul id="coach" class="coach-box"></ul>

        <!-- Logs -->
        <h2>Daily Logs</h2>

        <div class="table-wrapper">
            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Steps</th>
                        <th>Sleep</th>
                        <th>Work</th>
                        <th>Screen</th>
                        <th>Mood</th>
                        <th>Stress</th>
                        <th>Water</th>
                        <th>Calories</th>
                        <th>Exercise</th>
                        <th>Learning</th>
                    </tr>
                </thead>

                <tbody id="logTable"></tbody>

            </table>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
