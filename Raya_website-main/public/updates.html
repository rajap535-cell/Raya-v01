<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raya Updates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="updates.js"></script>
</head>
<body class="bg-gradient-to-b from-slate-950 to-slate-900 text-white font-sans">

  <div id="navbar-placeholder"></div>

  <!-- Hero -->
  <header class="text-center py-16">
    <h1 class="text-5xl font-bold text-cyan-400 mb-4">🚀 Latest from Raya</h1>
    <p class="text-slate-300 text-lg">Stay in sync with every milestone, breakthrough, and upgrade.</p>
  </header>

  <!-- Updates Container -->
  <section class="px-6 md:px-12 py-10">
    <div id="updates-container" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <!-- Coming Soon Callout -->
  <section class="px-6 md:px-12 pb-16">
    <div class="p-6 rounded-xl border border-yellow-400 shadow-lg shadow-yellow-400/40 text-center">
      <h2 class="text-2xl font-semibold text-yellow-300 mb-2">✨ Coming Soon</h2>
      <p class="text-slate-300">
        Multi-source search, live experiments, and open contributions will be arriving soon.
      </p>
    </div>
  </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>
    <script src="../src/scripts/layout-loader.js"></script>
<!-- Load Raya Assistant -->
<div id="raya-assistant-container"></div>
</body>
</html>
